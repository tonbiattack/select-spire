name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk for the GUI tests
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Unit tests
        run: xvfb-run -a python -m unittest discover -s tests -v
